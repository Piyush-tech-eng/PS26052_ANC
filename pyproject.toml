[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "ps26052-anc"
version = "0.1.0"
description = "AI-driven Adaptive Noise Cancellation for Defence Communications"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26"
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]